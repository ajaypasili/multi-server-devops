events {}

http {

    upstream node_app {
        server app:3000;
    }

    # HTTP
    server {
        listen 80;
        listen [::]:80;

        server_name ajaydevopsassignment.duckdns.org;

        # Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name ajaydevopsassignment.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/ajaydevopsassignment.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ajaydevopsassignment.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://node_app;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
